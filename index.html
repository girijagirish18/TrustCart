
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustCart | Verify Before You Buy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>TRUSTCART</h1>
        <p>Verify before you buy.</p>
    </header>

    <main>
        <h2>Is your online purchase safe?</h2>
        <p>Check potential warning signs before making a purchase.</p>

        <div class="search-box">
            <input type="text" id="websiteInput"
                placeholder="Enter shopping website name">

            <button id="checkButton">Check Website</button>
        </div>

        <p id="result"></p>
    </main>

    <script src="script.js"></script>

</body>
</html>
